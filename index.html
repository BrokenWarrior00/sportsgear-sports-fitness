<!DOCTYPE html>
<html>
<head>
    <title>SportGear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SportGear</h1>
        <p>Sports and Fitness Store</p>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart</a>
            <a href="#wishlist">Wishlist</a>
            <a href="#checkout">Checkout</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <div id="home" class="banner">
        <h2>Play Better. Stay Fit.</h2>
        <p>Find the sports products you need.</p>
        <a href="#products" class="button">Shop Now</a>
    </div>

    <div class="section">
        <h2>Categories</h2>

        <button onclick="showCategory('All')">All</button>
        <button onclick="showCategory('Footwear')">Footwear</button>
        <button onclick="showCategory('Apparel')">Apparel</button>
        <button onclick="showCategory('Gym Equipment')">Gym Equipment</button>
        <button onclick="showCategory('Team Sports')">Team Sports</button>
    </div>

    <div id="products" class="section">
        <h2>Our Products</h2>

        <input type="text" id="searchBox"
            placeholder="Search products..."
            onkeyup="showProducts()">

        <select id="categoryBox" onchange="showProducts()">
            <option value="All">All Categories</option>
            <option value="Footwear">Footwear</option>
            <option value="Apparel">Apparel</option>
            <option value="Gym Equipment">Gym Equipment</option>
            <option value="Team Sports">Team Sports</option>
        </select>

        <div id="productList" class="products"></div>
    </div>

    <div id="cart" class="section">
        <h2>My Cart</h2>
        <div id="cartList"></div>
        <h3 id="total">Total: ₹0</h3>
    </div>

    <div id="wishlist" class="section">
        <h2>My Wishlist</h2>
        <div id="wishlistList"></div>
    </div>

    <div id="checkout" class="section">
        <h2>Checkout</h2>

        <form id="checkoutForm">
            <label>Name</label>
            <input type="text" id="customerName" required>

            <label>Email</label>
            <input type="email" id="customerEmail" required>

            <label>Phone Number</label>
            <input type="tel" id="customerPhone" required>

            <label>Delivery Address</label>
            <textarea id="customerAddress" required></textarea>

            <label>Payment Method</label>
            <select id="payment" required>
                <option value="">Select Payment</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="UPI Demo">UPI Demo</option>
                <option value="Card Demo">Card Demo</option>
            </select>

            <button type="submit">Place Order</button>
        </form>

        <div id="tracking" class="section">

            <h2>Track My Order</h2>

        <input type="text" id="orderId"
            placeholder="Enter Order ID">

            <button onclick="trackOrder()">Track</button>

            <p id="trackingMessage"></p>

            <h3>Order History</h3>

        <div id="orderHistory"></div>

</div>
<script src="script.js"></script>
</body>
</html>
